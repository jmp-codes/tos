<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOS Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#f4f6fa; --surface:#ffffff; --sunk:#eef1f7; --ink:#1b2130; --muted:#5a6479; --line:#d7deea; --line-strong:#b9c3d6;
  --accent:#2c4a8f; --accent-ink:#ffffff; --accent-soft:#e3eaf8; --head:#b4c6e7; --head-ink:#14203a;
  --ok:#2e7a4d; --ok-soft:#e2f2e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Libre Bodoni","Bodoni MT","Didot",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11151e; --surface:#181e2b; --sunk:#131927; --ink:#e5e9f2; --muted:#9aa4b9; --line:#2a3345; --line-strong:#3a4660;
    --accent:#8eaaf2; --accent-ink:#0f1830; --accent-soft:#1f2c4a; --head:#2a3b62; --head-ink:#e5ecfb;
    --ok:#7fcf9d; --ok-soft:#173226; --warn:#f0b35a; --warn-soft:#3a2b12; --bad:#f28b82; --bad-soft:#3d1b19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11151e; --surface:#181e2b; --sunk:#131927; --ink:#e5e9f2; --muted:#9aa4b9; --line:#2a3345; --line-strong:#3a4660;
  --accent:#8eaaf2; --accent-ink:#0f1830; --accent-soft:#1f2c4a; --head:#2a3b62; --head-ink:#e5ecfb;
  --ok:#7fcf9d; --ok-soft:#173226; --warn:#f0b35a; --warn-soft:#3a2b12; --bad:#f28b82; --bad-soft:#3d1b19;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.status.saving i{background:var(--warn)}
.status.local i{background:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:20px}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);padding:16px}}

.lib{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:900px){.lib{position:static}}
.lib h2,.sec h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
.lib-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.lib-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.lib-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lib-item:hover{background:var(--surface);border-color:var(--line)}
.lib-item[aria-current="true"]{background:var(--surface);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lib-item .n{font-weight:600;line-height:1.3}
.lib-item .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--muted)}
.tag.major{background:var(--accent-soft);color:var(--accent)}
.tag.minor{background:var(--warn-soft);color:var(--warn)}
.lib-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}

.work{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
@media (max-width:600px){.sec{padding:14px}}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px}
.sec-head p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
.sec-head .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f.span2{grid-column:span 2}
@media (max-width:520px){.f.span2{grid-column:1/-1}}
.f label,.lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.f textarea{resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
.subject-input{font-family:var(--display);font-size:20px !important;font-weight:700}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.levels .f input{text-align:center;font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.sig{display:flex;flex-direction:column;gap:6px}

.topics{display:flex;flex-direction:column;gap:12px}
.topic{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 110px;gap:10px 14px}
@media (max-width:1000px){.topic{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:600px){.topic{grid-template-columns:minmax(0,1fr)}}
.topic-bar{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.topic-bar .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.topic-bar .sp{margin-left:auto;display:flex;gap:2px}
.topic .f textarea{min-height:92px}
.topic .hrs input{font-family:var(--mono);font-size:16px;text-align:center}
.topic .share{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;background:var(--surface)}
.chip b{font-family:var(--mono);font-weight:500;font-size:13px}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}

.form-sheet{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sheet-title{text-align:center;padding:14px 12px 10px}
.sheet-title .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sheet-title .s{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.25;margin-top:2px}
.sheet-title .e{font-style:italic;color:var(--muted);font-size:13px}
table.tos{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
table.tos th,table.tos td{border:1px solid var(--line-strong);padding:6px 8px;vertical-align:top}
table.tos thead th{background:var(--head);color:var(--head-ink);font-weight:600;text-align:center;vertical-align:middle;line-height:1.25}
table.tos thead tr.pct th{font-weight:400;font-style:italic;font-family:var(--mono);font-size:12px}
table.tos td.c{text-align:center;vertical-align:middle;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.tos td.lo ol{margin:0;padding-left:18px}
table.tos td.lo li{margin-bottom:4px}
table.tos td.tp .t{font-weight:600}
table.tos td.tp ul{margin:4px 0 0;padding-left:18px}
table.tos td.cog{text-align:center;vertical-align:middle}
table.tos td.cog .cnt{font-family:var(--mono);font-size:15px;font-weight:500}
table.tos td.cog .ids{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
table.tos td.cog input{width:54px;text-align:center;font-family:var(--mono);border:1px solid var(--line-strong);border-radius:4px;padding:2px;background:var(--surface)}
table.tos td.cog.edited .cnt,table.tos td.cog.edited input{color:var(--accent);font-weight:600}
table.tos tr.bad-row td{background:var(--bad-soft)}
table.tos tfoot td{font-weight:600;background:var(--sunk)}
table.tos tfoot td.lbl-cell{text-align:right;font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:13px}
.work-note{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px;white-space:nowrap}
.sheet-sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px 16px 16px;font-size:13px;min-width:980px}
.sheet-sign .who{font-weight:700;margin-top:22px}
.sheet-sign .role{font-style:italic;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:12px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--accent)}

details.how{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:500}
details.how ol{margin:8px 0 0;padding-left:20px;max-width:75ch}
details.how li{margin-bottom:4px}
details.how code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:0 4px;border-radius:3px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);color:var(--ink);font-size:22px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.btn,.lib-item{transition:background .12s,border-color .12s}}
</style>
</head>
<body>


<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>TOS Builder</b><span>Table of Specifications · OMSC Form COL-25</span></div>
    <div class="status local" id="status"><i></i><span id="statusText">Starting…</span></div>
    <div class="actions">
      <button class="btn primary" id="btnExport" type="button">Export Word (.docx)</button>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="lib" aria-label="Saved tables">
    <div class="lib-head"><h2>Your TOS</h2><button class="btn sm" id="btnNew" type="button">+ New</button></div>
    <ul class="lib-list" id="libList"></ul>
    <div class="lib-foot">
      <button class="btn sm" id="btnExportAll" type="button" title="All saved TOS in one Word file, one per page">Export all to one .docx</button>
      <button class="btn sm ghost" id="btnBackup" type="button">Backup (.json)</button>
      <button class="btn sm ghost" id="btnRestore" type="button">Restore</button>
      <input type="file" id="fileRestore" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main class="work" id="work"></main>
</div>
<div class="toast" id="toast" hidden></div>

function newDoc(){

function normalize(d){
  const n = Object.assign(newDoc(), d);
  n.sigs = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SIGS)), d.sigs||{});
  n.overrides = d.overrides || {};
  n.topics = (d.topics||[]).map(t=>({title:t.title||"", subtopics:t.subtopics||[], outcomes:t.outcomes||[], hours:+t.hours||0}));

/* ---------------- computation ---------------- */
const EPS = 1e-9;
const sum = a => a.reduce((x,y)=>x+y,0);
// Largest remainder: integers that sum to `total`, each as close as possible to its exact share
function lrm(vals,total){
  const v = vals.map(x=>Math.round(x*1e9)/1e9);
  const fl = v.map(x=>Math.floor(x+EPS));
  let rem = total - sum(fl);
  const order = v.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  for(let k=0; rem>0 && order.length; k=(k+1)%order.length){ fl[order[k][1]]++; rem--; }
  for(let k=0; rem<0 && order.length; k=(k+1)%order.length){ const i=order[order.length-1-k][1]; if(fl[i]>0){fl[i]--; rem++;} }
  return fl;
}
// Controlled rounding: round a matrix so every row AND every column hits its integer target
function balance(E,rowT,colT){
  const n=E.length, m=colT.length;
  const F=E.map(r=>r.map(x=>Math.floor(x+EPS)));
  const inc=E.map(r=>r.map(()=>0));
  const rn=rowT.map((t,i)=>t-sum(F[i]));
  const cn=colT.map((t,j)=>t-sum(F.map(r=>r[j])));
  const cells=[]; E.forEach((r,i)=>r.forEach((x,j)=>cells.push([x-F[i][j],i,j])));
  cells.sort((a,b)=>b[0]-a[0]||a[1]-b[1]||a[2]-b[2]);
  for(const [,i,j] of cells){ if(rn[i]>0&&cn[j]>0){inc[i][j]=1;rn[i]--;cn[j]--;} }
  // augmenting paths for anything greedy could not place
  for(let i=0;i<n;i++){
    while(rn[i]>0){
      const prevCol=new Array(m).fill(-2), prevRow=new Array(n).fill(-2);
      prevRow[i]=-1; let q=[i], end=-1;
      while(q.length&&end<0){
        const nq=[];
        for(const r of q){
          for(let j=0;j<m&&end<0;j++){
            if(inc[r][j]===0 && prevCol[j]===-2 && E[r][j]-F[r][j]>EPS){
              prevCol[j]=r;
              if(cn[j]>0){end=j;break;}
              for(let k=0;k<n;k++) if(inc[k][j]===1 && prevRow[k]===-2){prevRow[k]=j; nq.push(k);}
            }
          }
          if(end>=0)break;
        }
        q=nq;
      }
      if(end<0){ // fallback: keep the row total right even if a column drifts
        let best=-1,bf=-1; for(let j=0;j<m;j++) if(inc[i][j]===0 && E[i][j]-F[i][j]>bf){bf=E[i][j]-F[i][j];best=j;}
        if(best<0) best=0; inc[i][best]++; rn[i]--; if(cn[best]>0)cn[best]--; continue;
      }
      let j=end; cn[j]--;
      while(true){ const r=prevCol[j]; inc[r][j]=1; if(r===i)break; const pj=prevRow[r]; inc[r][pj]=0; j=pj; }
      rn[i]--;
    }
  }
  return F.map((r,i)=>r.map((x,j)=>x+inc[i][j]));
}
function rng(seed){ let a=seed>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }

function compute(d){
  const hrs = d.topics.map(t=>Math.max(0,+t.hours||0));
  const H = sum(hrs), N = Math.max(0, Math.round(+d.totalItems||0));
  const L = d.levels.map(x=>+x||0), Lsum = sum(L);
  const n = d.topics.length;
  const scale = Math.pow(10, d.pctDecimals);
  const exactPct = hrs.map(h=> H>0 ? h/H*100 : 0);
  const pct = H>0 ? lrm(exactPct.map(p=>p*scale), 100*scale).map(x=>x/scale) : hrs.map(()=>0);
  const exactItems = hrs.map(h=> H>0 ? h/H*N : 0);
  const items = H>0 ? lrm(exactItems, N) : hrs.map(()=>0);
  const colExact = L.map(p=> Lsum>0 ? N*p/Lsum : 0);
  const colT = lrm(colExact, N);
  const E = items.map(it=>L.map(p=> Lsum>0 ? it*p/Lsum : 0));
  const auto = (H>0 && Lsum>0) ? balance(E, items, colT) : items.map(()=>[0,0,0]);
  const cells = auto.map((r,i)=>r.map((x,j)=>{ const k=i+"-"+j; return (k in d.overrides) ? Math.max(0,Math.round(+d.overrides[k]||0)) : x; }));
  const rowSums = cells.map(sum);
  const colSums = [0,1,2].map(j=>sum(cells.map(r=>r[j])));
  const totalCells = sum(rowSums);
  // item placement
  const order=[]; // [i,j] slot per item in fill order
  if(d.placement==="level"){ for(let j=0;j<3;j++) for(let i=0;i<n;i++) for(let c=0;c<cells[i][j];c++) order.push([i,j]); }
  else { for(let i=0;i<n;i++) for(let j=0;j<3;j++) for(let c=0;c<cells[i][j];c++) order.push([i,j]); }
  let nums = Array.from({length:totalCells},(_,k)=>k+1);
  if(d.placement==="random"){ const r=rng(d.seed); for(let k=nums.length-1;k>0;k--){const x=Math.floor(r()*(k+1));[nums[k],nums[x]]=[nums[x],nums[k]];} }
  const ids = cells.map(r=>r.map(()=>[]));
  order.forEach(([i,j],k)=>ids[i][j].push(nums[k]));
  ids.forEach(r=>r.forEach(a=>a.sort((x,y)=>x-y)));
  const problems=[];
  if(H<=0) problems.push("Enter the hours taught for at least one topic.");
  if(Math.abs(Lsum-100)>EPS) problems.push(`Cognitive level percentages add up to ${fmt(Lsum)}%, not 100%.`);
  rowSums.forEach((s,i)=>{ if(s!==items[i]) problems.push(`Topic ${i+1}: level counts add up to ${s}, but the topic has ${items[i]} items.`); });
  return {hrs,H,N,L,exactPct,pct,exactItems,items,colT,E,auto,cells,rowSums,colSums,totalCells,ids,problems};
}
function fmt(x,dec){ if(dec===undefined){ return (Math.round(x*100)/100).toString(); } return (+x).toFixed(dec).replace(/\.0+$/,"").replace(/(\.\d*?)0+$/,"$1"); }
function fmtPct(x,d){ return d.pctDecimals ? (+x).toFixed(d.pctDecimals).replace(/\.0$/,"") : String(Math.round(x)); }

/* ---------------- persistence ---------------- */
const saveTimers = {};
function setStatus(kind,text){ const s=document.getElementById("status"); s.className="status "+kind; document.getElementById("statusText").textContent=text; }
function cacheLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({lib,currentId})); }catch(e){} }
function persist(d){
  d.updatedAt = Date.now();
  cacheLocal();
  if(mode!=="db"){ setStatus("local","Saved in this browser"); return; }
  setStatus("saving","Saving…");
  clearTimeout(saveTimers[d.id]);
  saveTimers[d.id] = setTimeout(async()=>{
    try{ await db.collection("tos").doc(d.id).set(JSON.parse(JSON.stringify(d))); setStatus("ok","All changes saved"); }
    catch(e){ setStatus("local","Couldn’t reach saved storage — kept in this browser"); }
  }, 700);
}
async function removeDoc(id){
  lib = lib.filter(d=>d.id!==id); cacheLocal();
  if(mode==="db"){ try{ await db.collection("tos").doc(id).delete(); }catch(e){} }
}
async function init(){
  try{ const c=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(c&&Array.isArray(c.lib)){ lib=c.lib.map(normalize); currentId=c.currentId; } }catch(e){}
  if(!lib.find(d=>d.id===currentId)) currentId = lib[0]?.id || null;
  renderAll();
  setStatus("local","Saved in this browser");
  try{
    db = window.claude?.use ? await window.claude.use("db") : null;
    if(db){
      const snap = await db.collection("tos").get();
      const remote = snap.docs.map(s=>normalize(Object.assign({id:s.id}, s.data())));
      mode="db";
      if(remote.length){
        const byId = new Map(remote.map(d=>[d.id,d]));
        for(const d of lib){ const r=byId.get(d.id); if(!r || (d.updatedAt||0)>(r.updatedAt||0)){ byId.set(d.id,d); db.collection("tos").doc(d.id).set(JSON.parse(JSON.stringify(d))).catch(()=>{}); } }
        lib=[...byId.values()];
      } else { for(const d of lib) db.collection("tos").doc(d.id).set(JSON.parse(JSON.stringify(d))).catch(()=>{}); }
      lib.sort((a,b)=>(a.order??0)-(b.order??0)||(a.updatedAt||0)-(b.updatedAt||0));
      if(!lib.find(d=>d.id===currentId)) currentId = lib[0]?.id || null;
      cacheLocal(); renderAll(); setStatus("ok","All changes saved");
    }
  }catch(e){ mode="local"; setStatus("local","Saved in this browser"); }
}

function renderTable(){
  const d=cur(); if(!d) return;
  const c=compute(d);
  d.topics.forEach((t,i)=>{ const s=document.getElementById("share"+i); if(s) s.textContent = c.H>0 ? `${fmtPct(c.pct[i],d)}% · ${c.items[i]} items` : ""; });
  const colOk = c.colSums.every((s,j)=>s===c.colT[j]);
  const chips = [
    `<span class="chip">Total hours <b>${fmt(c.H)}</b></span>`,
    `<span class="chip">Items <b>${c.totalCells}/${c.N}</b></span>`,
    `<span class="chip">Split <b>${c.colSums.join(" / ")}</b></span>`,
    c.problems.length ? `<span class="chip bad">${c.problems.length} issue${c.problems.length>1?"s":""} to fix</span>`
      : colOk ? `<span class="chip ok">Rows and columns balance</span>` : `<span class="chip warn">Level totals differ from ${c.colT.join(" / ")}</span>`
  ].join("");
  const probs = c.problems.length ? `<ul style="margin:0 0 12px;padding-left:18px;color:var(--bad);font-size:13px">${c.problems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>` : "";
  const hasOv = Object.keys(d.overrides).length>0;
  const examLine = examText(d);
  const rows = d.topics.map((t,i)=>{
    const bad = c.rowSums[i]!==c.items[i];
    return `<tr class="${bad?"bad-row":""}">
      <td class="lo">${t.outcomes.length?`<ol>${t.outcomes.map(o=>`<li>${esc(o)}</li>`).join("")}</ol>`:""}</td>
      <td class="tp"><div class="t">${esc(t.title)||'<span class="hint">Untitled topic</span>'}</div>${t.subtopics.length?`<ul>${t.subtopics.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</td>
      <td class="c">${fmt(c.hrs[i])}</td>
      <td class="c">${fmtPct(c.pct[i],d)}${showWork&&c.H?`<span class="work-note">${fmt(c.hrs[i])}÷${fmt(c.H)}×100</span><span class="work-note">= ${c.exactPct[i].toFixed(2)}</span>`:""}</td>
      <td class="c">${c.items[i]}${showWork&&c.H?`<span class="work-note">${c.exactItems[i].toFixed(2)} → ${c.items[i]}</span>`:""}</td>
      ${[0,1,2].map(j=>{ const k=i+"-"+j, ed=(k in d.overrides);
        return `<td class="cog ${ed?"edited":""}">${adjust?`<input type="number" min="0" step="1" data-ov="${k}" value="${c.cells[i][j]}" aria-label="Topic ${i+1} ${LEVELS[j].a}${LEVELS[j].b} items">`:`<div class="cnt">${c.cells[i][j]}</div>`}
          ${showWork?`<span class="work-note">${c.E[i][j].toFixed(2)} → ${c.auto[i][j]}</span>`:""}
          ${c.ids[i][j].length?`<div class="ids">(${c.ids[i][j].join(", ")})</div>`:""}</td>`; }).join("")}
    </tr>`;
  }).join("");
  $("#tableArea").innerHTML = `
    ${probs}<div class="chips">${chips}</div>
    <div class="toolbar">
      <div class="f" style="flex-direction:row;align-items:center;gap:8px"><label for="f-place" style="white-space:nowrap">Item placement</label>
        <select id="f-place" data-k="placement" style="width:auto">
          <option value="random" ${d.placement==="random"?"selected":""}>Randomized</option>
          <option value="level" ${d.placement==="level"?"selected":""}>Easy → difficult (grouped by level)</option>
          <option value="topic" ${d.placement==="topic"?"selected":""}>In topic order</option>
        </select></div>
      ${d.placement==="random"?`<button class="btn sm" type="button" data-act="shuffle">Reshuffle numbers</button>`:""}
      <div class="f" style="flex-direction:row;align-items:center;gap:8px"><label for="f-dec" style="white-space:nowrap">Percent</label>
        <select id="f-dec" data-k="pctDecimals" data-num style="width:auto"><option value="0" ${d.pctDecimals==0?"selected":""}>Whole numbers</option><option value="1" ${d.pctDecimals==1?"selected":""}>1 decimal</option></select></div>
      <label class="toggle"><input type="checkbox" id="tg-work" ${showWork?"checked":""}> Show working</label>
      <label class="toggle"><input type="checkbox" id="tg-adj" ${adjust?"checked":""}> Adjust counts by hand</label>
      ${hasOv?`<button class="btn sm ghost" type="button" data-act="clearOv">Reset to computed counts</button>`:""}
    </div>
    <div class="form-sheet">
      <div class="sheet-title"><div class="k">Table of Specifications</div><div class="s">${esc(d.subject)||"Untitled subject"}</div><div class="e">${esc(examLine)}</div></div>
      <table class="tos">
        <thead>
          <tr><th rowspan="3" style="width:26%">Learning Outcomes/ Learning Competencies</th><th rowspan="3" style="width:24%">Topics</th><th rowspan="3">No. of Hours Taught</th><th rowspan="3">Percent</th><th rowspan="3">Number of Items/ Points</th><th colspan="3">Cognitive Levels and Item Placement</th></tr>
          <tr>${LEVELS.map(l=>`<th><i>${l.a}<br>${l.b}</i></th>`).join("")}</tr>
          <tr class="pct">${d.levels.map(p=>`<th>${fmt(p)}%</th>`).join("")}</tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td></td><td class="lbl-cell">Total</td><td class="c">${fmt(c.H)}</td><td class="c">${c.H?"100":"0"}</td><td class="c">${c.totalCells}</td>${c.colSums.map(s=>`<td class="c">${s}</td>`).join("")}</tr></tfoot>
      </table>
      <div class="sheet-sign">${[["prepared","Prepared by:"],["reviewed","Reviewed:"],["approved","Approved:"]].map(([k,t])=>`<div><div>${t}</div><div class="who">${esc(d.sigs[k].name)}</div><div class="role">${esc(d.sigs[k].title)}</div></div>`).join("")}</div>
    </div>
    <details class="how"><summary>How the numbers are computed</summary>
      <ol>
        <li><b>Percent</b> = hours for the topic ÷ total hours × 100. Rounded so the column adds up to exactly 100.</li>
        <li><b>Number of items</b> = hours for the topic ÷ total hours × total items. Rounding goes to the topics with the largest remainders so the total is exactly ${c.N}.</li>
        <li><b>Cognitive levels</b> = the topic’s items × each level’s percentage (${d.levels.map(fmt).join(" / ")}). Rounding keeps every row equal to its item count and every column equal to ${c.colT.join(" / ")} of ${c.N}.</li>
        <li><b>Item placement</b> assigns exam item numbers 1–${c.totalCells} to each cell. Randomized placement stays fixed until you reshuffle.</li>
      </ol>
    </details>`;
}

document.addEventListener("input", e=>{
  const el=e.target, d=cur(); if(!d) return;
  if(el.dataset.k){
    let v = el.value; if(el.dataset.num!==undefined) v = +v;
    d[el.dataset.k]=v; persist(d);
    if(["subject","term","semester","ay"].includes(el.dataset.k)) renderLib();
    if(el.tagName!=="SELECT") renderTable();
  } else if(el.dataset.lv!==undefined){
    d.levels[+el.dataset.lv] = +el.value||0;
    const t = Object.entries(PRESETS).find(([,p])=>p.every((x,j)=>x===d.levels[j]));
    d.type = t ? t[0] : "custom";
    document.querySelectorAll("[data-type]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.type===d.type));
    d.overrides={}; persist(d); renderLib(); renderTable();
  } else if(el.dataset.sig){
    d.sigs[el.dataset.sig][el.dataset.sk]=el.value; persist(d); renderTable();
  } else if(el.dataset.t){
    const i=+el.closest(".topic").dataset.i, k=el.dataset.t;
    if(k==="hours") d.topics[i].hours = +el.value||0;
    else if(k==="title") d.topics[i].title = el.value;
    else d.topics[i][k] = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
    persist(d); renderTable();
  } else if(el.dataset.ov){
    d.overrides[el.dataset.ov] = Math.max(0, Math.round(+el.value||0)); persist(d);
  }
});
document.addEventListener("change", e=>{
  const el=e.target, d=cur();
  if(el.id==="tg-work"){ showWork=el.checked; renderTable(); return; }
  if(el.id==="tg-adj"){ adjust=el.checked; renderTable(); return; }
  if(el.id==="fileRestore"){ restoreFile(el.files[0]); el.value=""; return; }
  if(d && ((el.tagName==="SELECT" && el.dataset.k) || el.dataset.ov)){ renderTable(); }
});
document.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=cur();
  if(b.classList.contains("lib-item")){ currentId=b.dataset.id; adjust=false; cacheLocal(); renderAll(); return; }

  if(b.id==="btnBackup"){ backup(); return; }

  if(act==="del"){
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Confirm delete"; setTimeout(()=>{ if(b.isConnected){b.classList.remove("armed"); b.textContent="Delete";} },4000); return; }
    const name=d.subject||"Untitled"; await removeDoc(d.id); currentId=lib[0]?.id||null; renderAll(); toast(`Deleted “${name}”`); return;
  }
  if(act==="addTopic"){ d.topics.push({title:"",subtopics:[],outcomes:[],hours:0}); d.overrides={}; persist(d); renderWork(); document.getElementById(`t${d.topics.length-1}-title`)?.focus(); return; }
  const topicEl=b.closest(".topic"); const i=topicEl?+topicEl.dataset.i:-1;
  if(act==="rmTopic"&&i>=0){ d.topics.splice(i,1); d.overrides={}; persist(d); renderWork(); return; }
  if((act==="up"||act==="down")&&i>=0){ const j=act==="up"?i-1:i+1; [d.topics[i],d.topics[j]]=[d.topics[j],d.topics[i]]; d.overrides={}; persist(d); renderWork(); return; }
  if(act==="shuffle"){ d.seed=Math.floor(Math.random()*1e9); persist(d); renderTable(); return; }
  if(act==="clearOv"){ d.overrides={}; persist(d); renderTable(); return; }
});
function fileName(d){ return `TOS - ${(d.subject||"Untitled").replace(/[\\/:*?"<>|]/g,"")} - ${d.term}.docx`; }

/* ---------------- files ---------------- */
async function offerFile(filename, data){
  let dl=null; try{ dl = window.claude?.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename, data}); toast(`Saved ${filename}`); }
    catch(err){ if(err&&err.code==="declined") return; toast("Couldn’t save the file here. Try again in a moment."); }
    return;
  }
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function backup(){ const data=JSON.stringify({app:"tos-builder",version:1,exported:new Date().toISOString(),tos:lib},null,1); offerFile(`TOS backup ${todayISO()}.json`, new Blob([data],{type:"application/json"})); }
function restoreFile(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{
    const j=JSON.parse(r.result); const arr=Array.isArray(j)?j:(j.tos||[]);
    if(!arr.length) throw 0;
    let added=0; for(const x of arr){ const n=normalize(x); if(!n.id||lib.find(d=>d.id===n.id)) n.id=uid(); n.order=lib.length; lib.push(n); persist(n); added++; }
    currentId=lib[lib.length-1].id; renderAll(); toast(`Restored ${added} TOS`);
  }catch(e){ toast("That file isn’t a TOS Builder backup."); } };
  r.readAsText(f);
}

/* ---------------- Word export ---------------- */
const xe = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const FONT = '<w:rFonts w:ascii="Times New Roman" w:eastAsia="Calibri" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
function R(text,o={}){
  const pr = FONT + (o.b?'<w:b/><w:bCs/>':'') + (o.i?'<w:i/><w:iCs/>':'') + (o.u?'<w:u w:val="single"/>':'') + (o.sup?'<w:vertAlign w:val="superscript"/>':'') + `<w:sz w:val="${o.sz||22}"/><w:szCs w:val="${o.sz||22}"/>`;
  if(o.tab) return `<w:r><w:rPr>${pr}</w:rPr><w:tab/></w:r>`;
  return `<w:r><w:rPr>${pr}</w:rPr><w:t xml:space="preserve">${xe(text)}</w:t></w:r>`;
}
function P(runs,o={}){
  const ppr = `<w:pPr><w:spacing w:before="0" w:after="${o.after||0}" w:line="240" w:lineRule="auto"/>${o.ind?`<w:ind w:left="${o.ind}" w:hanging="${o.hang||o.ind}"/>`:""}${o.jc?`<w:jc w:val="${o.jc}"/>`:""}</w:pPr>`;
  return `<w:p>${ppr}${runs}</w:p>`;
}
const HEAD_SHD = '<w:shd w:val="clear" w:color="auto" w:fill="B4C6E7"/>';
function TC(w, paras, o={}){
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.span?`<w:gridSpan w:val="${o.span}"/>`:""}${o.vm==="restart"?'<w:vMerge w:val="restart"/>':o.vm?'<w:vMerge/>':""}${o.shd?HEAD_SHD:""}<w:vAlign w:val="${o.va||"center"}"/></w:tcPr>${paras||P("")}</w:tc>`;
}
const COLS=[4250,4150,960,1100,1120,1580,1330,1350];
function tableXML(d,c){
  const bd='<w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/>';
  let x = `<w:tbl><w:tblPr><w:tblW w:w="${sum(COLS)}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="90" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr><w:tblGrid>${COLS.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;
  const hb = t => P(R(t,{b:true,sz:22}),{jc:"center"});
  const heads=["Learning Outcomes/ Learning Competencies","Topics","No. of Hours Taught","Percent","Number of Items/ Points"];
  x += `<w:tr><w:trPr><w:tblHeader/></w:trPr>${heads.map((h,k)=>TC(COLS[k],hb(h),{vm:"restart",shd:1})).join("")}${TC(COLS[5]+COLS[6]+COLS[7],hb("Cognitive Levels and Item Placement"),{span:3,shd:1})}</w:tr>`;
  x += `<w:tr><w:trPr><w:tblHeader/></w:trPr>${heads.map((h,k)=>TC(COLS[k],"",{vm:1,shd:1})).join("")}${LEVELS.map((l,j)=>TC(COLS[5+j], P(R(l.a,{b:true,i:true}),{jc:"center"})+P(R(l.b,{b:true,i:true}),{jc:"center"}),{shd:1})).join("")}</w:tr>`;
  x += `<w:tr><w:trPr><w:tblHeader/></w:trPr>${heads.map((h,k)=>TC(COLS[k],"",{vm:1,shd:1})).join("")}${d.levels.map((p,j)=>TC(COLS[5+j],P(R(fmt(p)+"%",{i:true}),{jc:"center"}),{shd:1})).join("")}</w:tr>`;
  d.topics.forEach((t,i)=>{
    const lo = t.outcomes.length ? t.outcomes.map((o,k)=>P(R(`${k+1}.`)+R("",{tab:1})+R(o),{ind:360,after:60})).join("") : P("");
    const tp = P(R(t.title,{b:true,sz:24}),{after:40}) + t.subtopics.map(s=>P(R("•")+R("",{tab:1})+R(s),{ind:360})).join("");
    const cog = [0,1,2].map(j=>TC(COLS[5+j], P(R(String(c.cells[i][j])),{jc:"center"}) + (c.ids[i][j].length?P(R(`(${c.ids[i][j].join(", ")})`,{sz:20}),{jc:"center"}):"")));
    x += `<w:tr><w:trPr><w:cantSplit/></w:trPr>${TC(COLS[0],lo,{va:"center"})}${TC(COLS[1],tp,{va:"top"})}${TC(COLS[2],P(R(fmt(c.hrs[i])),{jc:"center"}))}${TC(COLS[3],P(R(fmtPct(c.pct[i],d)),{jc:"center"}))}${TC(COLS[4],P(R(String(c.items[i])),{jc:"center"}))}${cog.join("")}</w:tr>`;
  });
  const tb = s => P(R(String(s),{b:true}),{jc:"center"});
  x += `<w:tr>${TC(COLS[0],"")}${TC(COLS[1],P(R("Total",{b:true}),{jc:"right"}))}${TC(COLS[2],tb(fmt(c.H)))}${TC(COLS[3],tb(c.H?100:0))}${TC(COLS[4],tb(c.totalCells))}${c.colSums.map((s,j)=>TC(COLS[5+j],tb(s))).join("")}</w:tr>`;
  return x + `</w:tbl>`;
}
function sigXML(d){
  const W3=5280, nb='<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>';
  const cell=(k,label)=>`<w:tc><w:tcPr><w:tcW w:w="${W3}" w:type="dxa"/></w:tcPr>${P(R(label))}${P("")}${P("")}${P(R(d.sigs[k].name,{b:true}))}${P(R(d.sigs[k].title,{i:true}))}</w:tc>`;
  return `<w:tbl><w:tblPr><w:tblW w:w="${W3*3}" w:type="dxa"/>${nb}<w:tblLayout w:type="fixed"/><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid><w:gridCol w:w="${W3}"/><w:gridCol w:w="${W3}"/><w:gridCol w:w="${W3}"/></w:tblGrid><w:tr><w:trPr><w:cantSplit/></w:trPr>${cell("prepared","Prepared by:")}${cell("reviewed","Reviewed:")}${cell("approved","Approved:")}</w:tr></w:tbl>`;
}
function longDate(iso){ if(!iso) return ""; const [y,m,dd]=iso.split("-").map(Number); const M=["January","February","March","April","May","June","July","August","September","October","November","December"]; return `${M[m-1]} ${dd}, ${y}`; }
function sectionXML(d, idBase){
  const c=compute(d);
  const er = ASSETS.exam_rpr;
  const run = (t,sup)=> `<w:r>${sup?er.replace("</w:rPr>",'<w:vertAlign w:val="superscript"/></w:rPr>'):er}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
  let exam = run(`${d.term} Exam, `);
  if(d.semester==="Summer") exam += run(`Summer AY ${d.ay}`);
  else { const m=d.semester.match(/^(\d+)(\D+)$/); exam += m ? run(m[1])+run(m[2],true)+run(` Semester AY ${d.ay}`) : run(`${d.semester} Semester AY ${d.ay}`); }
  const it='<w:rPr>'+FONT+'<w:i/></w:rPr>', itu='<w:rPr>'+FONT+'<w:i/><w:u w:val="single"/></w:rPr>';
  const progLine = `<w:r>${it}<w:t xml:space="preserve">Curricular Program: ${xe(d.program)}</w:t></w:r><w:r>${it}<w:tab/></w:r><w:r>${it}<w:t xml:space="preserve">Date Submitted: </w:t></w:r><w:r>${itu}<w:t>${xe(longDate(d.dateSubmitted))}</w:t></w:r>`;
  let head = ASSETS.head.replace("{{PROGRAM}}",xe(d.program)).replace("{{CAMPUS}}",xe(d.campus)).replace("{{SUBJECT}}",xe(d.subject)).replace("{{EXAM_RUNS}}",exam).replace("{{PROGRAM_LINE}}",progLine);
  head = head.replace(/(<wp:docPr id=")(\d+)/g,(m,a,n)=>a+(idBase+ +n)).replace(/ w14:paraId="[^"]*"| w14:textId="[^"]*"/g,"");
  return head + P("") + tableXML(d,c) + P("") + P("") + sigXML(d);
}
async function exportDocx(docs, filename){
  if(typeof JSZip==="undefined"){ toast("The Word exporter didn’t load. Check your connection and reload."); return; }
  const bad = docs.map(d=>[d,compute(d)]).filter(([,c])=>c.problems.length);
  if(bad.length===1 && docs.length===1){ toast("Fix the issues listed above the table first."); return; }
  if(bad.length){ toast(`Fix the issues in: ${bad.map(([d])=>d.subject||"Untitled").join(", ")}`); return; }
  try{
    const zip = await JSZip.loadAsync(ASSETS.tpl,{base64:true});
    const sectBreak = `<w:p><w:pPr>${ASSETS.sect}</w:pPr></w:p>`;
    const body = docs.map((d,k)=>sectionXML(d,(k+1)*1000)).join(sectBreak);
    const xml = ASSETS.doc_open + body + ASSETS.sect + "</w:body></w:document>";
    zip.file("word/document.xml", xml);
    const blob = await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    await offerFile(filename, blob);
  }catch(e){ console.error(e); toast("Couldn’t build the Word file."); }
}
